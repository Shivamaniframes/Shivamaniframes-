<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shivamani Frames | Online Photo Frame Orders</title>
<meta name="description" content="Shivamani Frames - Online photo frame orders, custom frames and photo gifts.">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#1f2937}

header{
  background:#111827;
  color:white;
  padding:14px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}
.brand{display:flex;align-items:center;gap:12px}
.header-logo{
  width:62px;height:62px;object-fit:contain;
  border-radius:8px;
  display:block;
}
.brand-text h1{margin:0 0 3px;font-size:21px}
.brand-text p{margin:0;color:#d1d5db;font-size:12px}
nav{display:flex;gap:22px}
nav a{color:white;text-decoration:none;font-weight:700;font-size:14px}

.hero{
  background:linear-gradient(110deg,#111827 0%,#241b1a 55%,#4a2118 100%);
  color:white;
  padding:55px 7%;
}
.hero-inner{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  align-items:center;
  gap:45px;
}
.hero h2{
  margin:0 0 18px;
  font-size:48px;
  line-height:1.05;
  color:#fbbf24;
}
.hero p{font-size:18px;line-height:1.55;color:#f3f4f6;max-width:650px}
.hero-buttons{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.hero-btn{
  display:inline-block;padding:13px 25px;border-radius:10px;
  text-decoration:none;font-weight:700;
}
.order-btn{background:#22c55e;color:white}
.wa-btn{background:#fbbf24;color:#111827}
.hero-logo-wrap{text-align:center}
.hero-logo{
  width:min(100%,430px);
  max-height:270px;
  object-fit:contain;
  filter:drop-shadow(0 15px 25px rgba(0,0,0,.35));
  border-radius:10px;
}

.container{max-width:1000px;margin:auto;padding:18px}
.card{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 25px rgba(0,0,0,.08)}
.section-title{text-align:center}
.hero-note{text-align:center;color:#4b5563}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
label{display:block;font-weight:700;margin-bottom:7px}
input,select,textarea{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:#fff}
textarea{min-height:95px;resize:vertical}
.full{grid-column:1/-1}
.price-table{width:100%;border-collapse:collapse}
.price-table th,.price-table td{border:1px solid #e5e7eb;padding:10px;text-align:center}
.price-table th{background:#111827;color:white}
.price-table tr:nth-child(even){background:#f9fafb}
.preview{display:none;max-width:220px;max-height:220px;margin:12px auto 0;border-radius:12px}
.btn{width:100%;border:0;border-radius:12px;padding:15px;font-size:18px;font-weight:700;cursor:pointer}
.whatsapp{background:#16a34a;color:white}
.btn:disabled{opacity:.65;cursor:not-allowed}
.note{font-size:13px;color:#6b7280;line-height:1.5}
.status{margin-top:12px;padding:12px;border-radius:10px;display:none}
.success{background:#ecfdf5;color:#166534}
.error{background:#fef2f2;color:#991b1b}
footer{text-align:center;padding:25px;color:#6b7280}
</style>
</head>
